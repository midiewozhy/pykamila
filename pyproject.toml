[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykamila"
version = "0.1.1"
description = "KAMILA: A semiparametric clustering method for mixed data"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Marshal Hong Yuan Zhu", email = "marshal.hy.zhu@gmail.com"}
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/midiewozhy/pykamila"
"Bug Reports" = "https://github.com/midiewozhy/pykamila/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pykamila*"]